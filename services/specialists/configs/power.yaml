# Specialist configs for per-subsystem LSTM-AE training (task T1.3).
# Each file parameterises the shared LSTMAETemplate for one subsystem.
# Channels must match libs/config/channel_map.yaml (SMAP canonical IDs — ADR-0001).
# Verified via task T0.5 (data/spikes/T0.5_smap_feasibility.py).

subsystem: power
channels:
  - "P-1"  # Power Bus Voltage
  - "P-2"  # Solar Array Current
  - "P-3"  # Battery State of Charge
  - "P-4"  # Battery Cell Voltage

model:
  lstm_hidden_size: 64
  lstm_num_layers: 2
  latent_dim: 32
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  threshold_percentile: 95.0

