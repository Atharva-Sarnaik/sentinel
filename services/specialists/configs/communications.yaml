# Channels must match libs/config/channel_map.yaml (SMAP canonical IDs — ADR-0001).
subsystem: communications
channels:
  - "C-1"  # Downlink Signal Strength (RSSI)
  - "C-2"  # Transponder Output Power
  - "D-1"  # Command/Telemetry Buffer Fill Level

model:
  lstm_hidden_size: 64
  lstm_num_layers: 2
  latent_dim: 32
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  threshold_percentile: 95.0

