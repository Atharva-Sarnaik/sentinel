# Channels must match libs/config/channel_map.yaml (SMAP canonical IDs — ADR-0001).
subsystem: thermal
channels:
  - "T-1"  # Radiator Panel Temperature
  - "T-2"  # Instrument Enclosure Temperature
  - "T-3"  # Battery Module Temperature

model:
  lstm_hidden_size: 64
  lstm_num_layers: 2
  latent_dim: 32
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  threshold_percentile: 95.0

