# Channels must match libs/config/channel_map.yaml (SMAP canonical IDs — ADR-0001).
subsystem: attitude
channels:
  - "A-1"  # Reaction Wheel Speed X
  - "A-2"  # Reaction Wheel Speed Y
  - "A-3"  # Gyroscope Rate Z
  - "A-4"  # Star Tracker Quaternion W

model:
  lstm_hidden_size: 64
  lstm_num_layers: 2
  latent_dim: 32
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  threshold_percentile: 95.0

