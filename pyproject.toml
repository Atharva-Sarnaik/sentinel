# ============================================================
# pyproject.toml — Single source of truth for project identity
# To rename the project, change `name` and `project-name` here only.
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel"            # {{PROJECT_NAME}} resolved to "Sentinel"
version = "0.0.1.dev0"
description = "Multi-Agent AI System for Satellite Telemetry Health Monitoring and Anomaly Detection — decision-support research prototype, not flight software."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"   # tested on 3.11 and 3.12
authors = [
  { name = "Atharva Sarnaik", email = "placeholder@example.com" },
  { name = "Sujal Hede",      email = "placeholder@example.com" },
]
keywords = ["satellite", "telemetry", "anomaly-detection", "multi-agent", "lstm", "langgraph"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]

# Runtime dependencies (all pinned to minimum known-good, not locked)
dependencies = [
  "pydantic>=2.7,<3",
  "typer[all]>=0.12,<1",
  "rich>=13,<14",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.29,<1",
  "streamlit>=1.35,<2",
  "langgraph>=0.1,<1",
  "mlflow>=2.13,<3",
  "dvc>=3.50,<4",
  "langfuse>=2.20,<3",
  "pyyaml>=6,<7",
  "duckdb>=0.10,<1",
  "pyarrow>=16,<17",
  "numpy>=1.26,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.3,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.4,<1",
  "mypy>=1.10,<2",
  "import-linter>=2.1,<3",
  "pre-commit>=3.7,<4",
  "httpx>=0.27,<1",          # FastAPI test client
  "types-pyyaml",
]

[project.scripts]
sentinel = "apps.cli.main:app"

[project.urls]
Repository = "https://github.com/Atharva-Sarnaik/sentinel"
"Issue Tracker" = "https://github.com/Atharva-Sarnaik/sentinel/issues"

# ── Hatch ────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "libs"]

# ── Ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps", "services", "libs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "services", "libs"]

# ── Mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
mypy_path = "."
explicit_package_bases = true
# Apply strict checking only to libs/
[[tool.mypy.overrides]]
module = ["apps.*", "services.*", "tests.*"]
strict = false
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "integration: marks integration tests",
]

# ── Coverage ─────────────────────────────────────────────────
[tool.coverage.run]
source = ["apps", "services", "libs"]
omit = ["tests/*", "*/stubs/*"]

[tool.coverage.report]
fail_under = 0        # will be raised incrementally per tier

# ── import-linter ────────────────────────────────────────────
[tool.importlinter]
root_packages = ["apps", "services", "libs"]

[[tool.importlinter.contracts]]
name = "Services must not import each other directly"
type = "independence"
modules = [
  "services.data_plane",
  "services.feature_plane",
  "services.specialists",
  "services.baselines",
  "services.fusion",
  "services.reasoner",
  "services.verifier",
  "services.evaluation",
  "services.audit",
  "services.api",
  "services.observability",
]

[[tool.importlinter.contracts]]
name = "libs must not import services or apps"
type = "forbidden"
source_modules = ["libs"]
forbidden_modules = ["services", "apps"]
