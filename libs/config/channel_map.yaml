# channel_map.yaml
# =================
# Maps telemetry channel names to the four specialist subsystems.
#
# Verified via task T0.5 (SMAP/MSL Feasibility Spike) and ADR-0001.
# Datasets: NASA SMAP (primary), NASA MSL (secondary).

project_name: "Sentinel"

channel_map:
  power:
    - "P-1"  # Power Bus Voltage
    - "P-2"  # Solar Array Current
    - "P-3"  # Battery State of Charge
    - "P-4"  # Battery Cell Voltage

  thermal:
    - "T-1"  # Radiator Panel Temperature
    - "T-2"  # Instrument Enclosure Temperature
    - "T-3"  # Battery Module Temperature

  attitude:
    - "A-1"  # Reaction Wheel Speed X
    - "A-2"  # Reaction Wheel Speed Y
    - "A-3"  # Gyroscope Rate Z
    - "A-4"  # Star Tracker Quaternion W

  communications:
    - "C-1"  # Downlink Signal Strength (RSSI)
    - "C-2"  # Transponder Output Power
    - "D-1"  # Command/Telemetry Buffer Fill Level

data:
  dataset: "SMAP"       # NASA SMAP as primary (ADR-0001)
  replay_path: "data/raw"
  window_size: 100
  stride: 10
  test_fraction: 0.2    # chronological split — no random shuffling (ADR-0002)

model:
  lstm_hidden_size: 64
  lstm_num_layers: 2
  latent_dim: 32
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  threshold_percentile: 95.0

llm:
  provider: "openai"
  model_name: "gpt-4o-mini"
  max_retries: 2        # verifier retry budget (ADR-0002)
  temperature: 0.0
  max_tokens: 512
